name: Build Android app

on:
  push:
    branches: ["**"]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Same debug key from one build to the next, so a new APK installs over the previous one
      # (used only when no release keystore is configured in the repository secrets).
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Decode release keystore (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signature : clé de release"
          else
            echo "Signature : clé de debug (ajoutez ANDROID_KEYSTORE_BASE64 pour une signature permanente)"
          fi

      - name: Build APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APKs
        id: apk
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            abi="$(basename "$f" .apk | sed -e 's/^app-//' -e 's/-release$//')"
            cp "$f" "dist/YT-Downloader-Android-${abi}.apk"
          done
          ls -la dist
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: YT-Downloader-Android-${{ steps.apk.outputs.version }}
          path: android/dist/

      # Direct download link for the phone (not for pull requests).
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.apk.outputs.version }}
          name: YT Downloader Android ${{ steps.apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: |
            APK Android de YT Downloader (YouTube + Instagram).

            **Quel fichier ?** `YT-Downloader-Android-arm64-v8a.apk` pour presque tous les téléphones récents,
            `YT-Downloader-Android-universal.apk` si vous avez un doute (plus lourd, fonctionne partout).

            Installation : ouvrez le fichier sur le téléphone → autorisez « Installer des applis inconnues » pour
            votre navigateur ou gestionnaire de fichiers → Installer.
          files: |
            android/dist/*.apk
            android/dist/SHA256SUMS.txt
