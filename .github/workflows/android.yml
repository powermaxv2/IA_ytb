name: Build Android app

# - Push on a branch or pull request touching android/: build the APKs and keep them as a workflow artifact.
# - Push of a tag android-vX.Y.Z: build with the release key, check the signature and publish the GitHub release
#   "android-vX.Y.Z" with the file names the in-app updater looks for (YT-Downloader-X.Y.Z-<abi>.apk).
on:
  push:
    branches: ["**"]
    tags: ["android-v*"]
    # Path filters only apply to branch pushes: a tag push always builds.
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/android-v') }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$IS_RELEASE" = true ] && [ "$GITHUB_REF_NAME" != "android-v$version" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à android/VERSION ($version)."
            exit 1
          fi
          echo "Version $version"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Same debug key from one build to the next, so a test APK installs over the previous one
      # (branch builds without the release secrets only; a release always uses the release key).
      - name: Restore debug signing key
        if: env.IS_RELEASE != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      # The release key only reaches tag builds: a branch or pull request build (whose Gradle scripts anyone with
      # push access can change) never sees it and is signed with the debug key.
      - name: Decode release keystore
        if: env.IS_RELEASE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
              [ -n "${!name}" ] || { echo "::error::Secret $name manquant."; exit 1; }
            done
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signature : clé de release"
          else
            echo "::error::Une release doit être signée : ajoutez les secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS et ANDROID_KEY_PASSWORD."
            exit 1
          fi

      - name: Build APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/android-v') && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ startsWith(github.ref, 'refs/tags/android-v') && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/android-v') && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          [ "$IS_RELEASE" = true ] || echo "Signature : clé de debug (build de test ; seules les releases utilisent la clé de release)"
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Check signature and collect APKs
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # Optional repository variable: SHA-256 of the signing certificate of the APKs already installed.
          # When set, an APK signed with the release secrets but another key fails here instead of being refused
          # by the phones. Test builds signed with the debug key are not checked.
          EXPECTED_SIGNER: ${{ vars.ANDROID_SIGNER_SHA256 }}
        run: |
          [ -n "${ANDROID_KEYSTORE_PATH:-}" ] || EXPECTED_SIGNER=""
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          mkdir -p dist
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi="$(basename "$f" .apk | sed -e 's/^app-//' -e 's/-release$//')"
            certs="$("$apksigner" verify --print-certs "$f")"
            signer="$(sed -n 's/.*SHA-256 digest: //p' <<< "$certs" | head -n 1)"
            echo "$abi : certificat $signer"
            if [ -n "$EXPECTED_SIGNER" ] && [ "$signer" != "$EXPECTED_SIGNER" ]; then
              echo "::error::$abi est signé avec $signer, attendu $EXPECTED_SIGNER."
              exit 1
            fi
            # Name looked up by the in-app updater (core/AppUpdater.kt).
            cp "$f" "dist/YT-Downloader-$VERSION-$abi.apk"
          done
          [ -f "dist/YT-Downloader-$VERSION-universal.apk" ] || { echo "::error::APK universel absent."; exit 1; }
          (cd dist && sha256sum -- *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      # The manifest must stay installable: aapt reads it like the phone's installer does, and only MainActivity may
      # take a shared text/plain (a second SEND text/plain filter made some phones refuse 1.10.0).
      - name: Check manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          aapt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/aapt"
          apk="dist/YT-Downloader-$VERSION-universal.apk"
          "$aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -E "^(package|sdkVersion|targetSdkVersion|launchable-activity)" "$RUNNER_TEMP/badging.txt"
          "$aapt" dump xmltree "$apk" AndroidManifest.xml > "$RUNNER_TEMP/manifest.txt"
          text=$(grep -c '"text/plain"' "$RUNNER_TEMP/manifest.txt" || true)
          echo "Filtres text/plain : $text"
          [ "$text" -le 1 ] || { echo "::error::Plus d'un filtre text/plain dans le manifeste."; exit 1; }

      # Branch builds only: a tag publishes the same APKs and SHA256SUMS.txt as release assets (strict, below),
      # which do not count against the artifact quota. A full quota must not hide the tests and screenshots of a
      # branch build.
      - name: Upload APKs
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: YT-Downloader-Android-${{ steps.version.outputs.version }}
          path: android/dist/
          if-no-files-found: error

      # Screenshots of the three interfaces (JVM tests, Robolectric + Roborazzi), after the APKs so a failure
      # here never hides them.
      - name: Record screenshots
        if: env.IS_RELEASE != 'true'
        run: ./gradlew --no-daemon --stacktrace recordRoborazziDebug

      - name: Upload screenshots
        if: always() && env.IS_RELEASE != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: android/app/build/outputs/roborazzi/
          if-no-files-found: warn

      # Release notes: android/release-notes/X.Y.Z.md when it exists (shown in the app and the notification).
      - name: Release notes
        if: env.IS_RELEASE == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="release-notes/$VERSION.md"
          if [ -s "$notes" ]; then
            cp "$notes" "$RUNNER_TEMP/notes.md"
          else
            printf '%s\n' "Gulp Android $VERSION." "" \
              "Installation : ouvrez \`YT-Downloader-$VERSION-arm64-v8a.apk\` sur le téléphone (ou \`-universal\` en cas de doute)." \
              > "$RUNNER_TEMP/notes.md"
          fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Gulp Android ${{ steps.version.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          # Not "latest": the repository also hosts the macOS app.
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            android/dist/*.apk
            android/dist/SHA256SUMS.txt
