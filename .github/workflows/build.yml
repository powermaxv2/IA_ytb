name: Build macOS app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    # The Android app lives in android/ and has its own workflow.
    paths-ignore: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths-ignore: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build app bundle
        run: ./scripts/build_app.sh

      - name: Check tool download URLs
        run: |
          for u in \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos \
            https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-arm64.gz \
            https://github.com/denoland/deno/releases/latest/download/deno-aarch64-apple-darwin.zip ; do
            code=$(curl -sSL -o /dev/null -r 0-0 -w '%{http_code}' "$u")
            echo "$code  $u"
            case "$code" in 200|206) ;; *) exit 1 ;; esac
          done

      # A full artifact storage quota must not fail a branch or pull request build (tag releases stay strict).
      - uses: actions/upload-artifact@v4
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: YT-Downloader-macOS
          path: |
            dist/YT-Downloader.dmg
            dist/YT-Downloader-macOS.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/YT-Downloader.dmg
            dist/YT-Downloader-macOS.zip
